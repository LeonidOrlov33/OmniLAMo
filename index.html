<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniLAMo</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --neon-blue: #00d4ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00e5;
            --neon-green: #00ff88;
            --neon-red: #ff0044;
            --glass: rgba(15, 15, 40, 0.85);
            --glass-border: rgba(0, 212, 255, 0.3);
            --text: #e0e0ff;
            --muted: #8899cc;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }
        
        /* НЕОНОВАЯ СЕТКА НА ФОНЕ */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(191, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 3s linear infinite;
            pointer-events: none;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        
        /* НЕОНОВОЕ СВЕЧЕНИЕ */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.15), transparent 70%);
            pointer-events: none;
            animation: glowPulse 3s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .app { 
            width: 100%; 
            max-width: 450px; 
            height: 95vh; 
            background: var(--glass); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 0 40px rgba(0, 212, 255, 0.2),
                0 0 80px rgba(191, 0, 255, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        /* ШАПКА */
        .header { 
            background: transparent; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 26px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 
                0 0 20px rgba(0, 212, 255, 0.5),
                0 0 40px rgba(191, 0, 255, 0.3);
            animation: avatarGlow 2s infinite;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.5), 0 0 40px rgba(191, 0, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.8), 0 0 60px rgba(191, 0, 255, 0.5); }
        }
        .bot-info h2 { font-size: 17px; font-weight: 700; }
        .status { font-size: 12px; color: var(--neon-green); }
        .status::before { content: "●"; margin-right: 5px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .btn-menu { 
            background: none; 
            border: none; 
            color: var(--neon-blue); 
            font-size: 26px; 
            cursor: pointer; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%;
            transition: all 0.3s;
        }
        .btn-menu:hover { 
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        /* ЭКРАНЫ */
        .screen { 
            display: none; 
            flex: 1; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 30px; 
            gap: 20px;
        }
        .screen.active { display: flex; }
        .logo { 
            font-size: 80px; 
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-20px); } 
        }
        .welcome-title { 
            font-size: 28px; 
            font-weight: 700; 
            text-align: center;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-subtitle { 
            color: var(--muted); 
            text-align: center; 
            font-size: 14px; 
            line-height: 1.5;
        }
        .name-input { 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--glass-border); 
            border-radius: 25px; 
            padding: 15px 20px; 
            color: var(--text); 
            width: 100%; 
            font-size: 16px; 
            outline: none; 
            transition: all 0.3s;
        }
        .name-input:focus { 
            border-color: var(--neon-blue); 
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            padding: 15px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(191, 0, 255, 0.5);
        }
        .btn-primary:active { transform: scale(0.98); }
        
        /* ЧАТ */
        /* min-height: 0 — принципиально. У flex-элемента по умолчанию min-height:auto,
           поэтому длинная лента растягивала .chat-screen, а не включала прокрутку;
           .app с overflow:hidden просто обрезал её — колесо «не листалось».
           С нулевым минимумом высота колонки ограничена .app, и .chat-area
           становится настоящим прокручиваемым контейнером. */
        .chat-screen { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
        .chat-screen.active { display: flex; }
        .chat-area { 
            flex: 1; 
            min-height: 0;
            overflow-y: auto; 
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }
        /* Верх ленты: кнопка «показать раньше». Пустая, пока история не загружена. */
        .chat-top { display: flex; justify-content: center; }
        .chat-top:empty { display: none; }
        .history-more {
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent, #00d4ff);
            border: 1px solid rgba(0, 212, 255, 0.35);
            border-radius: 16px;
            padding: 8px 18px;
            font-size: 13px;
            cursor: pointer;
        }
        .history-more:hover { background: rgba(0, 212, 255, 0.2); }
        .msg { 
            max-width: 80%; 
            padding: 12px 18px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.4; 
            animation: msgIn 0.3s ease; 
            word-wrap: break-word;
            /* Текст реплик теперь вставляется через textContent, поэтому
               переводы строк (\n в ответах нейросети и в списке /tasks)
               нужно показывать явно — иначе они схлопывались в пробел. */
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .msg.bot { 
            background: rgba(0, 212, 255, 0.1); 
            border: 1px solid rgba(0, 212, 255, 0.2);
            align-self: flex-start; 
            border-bottom-left-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
        }
        .msg.user { 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            align-self: flex-end; 
            border-bottom-right-radius: 5px;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.3);
        }
        .msg-time { 
            font-size: 10px; 
            color: var(--muted); 
            margin-top: 5px; 
            display: block;
        }
        /* Листание чата: кнопка подгрузки старых реплик и метка начала переписки */
        .load-older {
            align-self: center;
            margin: 4px auto 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--neon-blue);
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .load-older:hover { background: rgba(0, 212, 255, 0.18); }
        .chat-start {
            align-self: center;
            margin: 4px auto 8px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }
        .msg.typing { 
            color: var(--muted); 
            font-style: italic; 
            display: flex; 
            align-items: center; 
            gap: 5px;
        }
        .typing-dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 50%; 
            background: var(--neon-blue); 
            animation: typing 1.4s infinite;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
        @keyframes msgIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* НИЖНЯЯ ПАНЕЛЬ */
        /* flex-shrink:0 — панель ввода не должна сжиматься, когда лента длинная:
           иначе она «уезжала» вверх и перекрывала последние сообщения. */
        .input-area { 
            flex-shrink: 0;
            background: transparent; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            border-top: 1px solid var(--glass-border);
        }
        /* Два ряда вместо одного: сверху главное (микрофон, ввод, отправка),
           снизу — дополнительные кнопки. В одну строку пять элементов на
           узком экране сжимали поле ввода до нечитаемой ширины. */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-row-extra { justify-content: center; }
        .input-field { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--glass-border); 
            border-radius: 30px; 
            padding: 14px 20px; 
            color: var(--text); 
            font-size: 15px; 
            outline: none;
            transition: all 0.3s;
        }
        .input-field:focus { 
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .btn { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: none; 
            cursor: pointer; 
            font-size: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .btn-send { 
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }
        .btn-send:hover { transform: scale(1.1); }
        .btn-send:active { transform: scale(0.9); }
        .btn-mic { 
            background: rgba(0, 0, 0, 0.5); 
            color: var(--neon-blue);
            border: 1px solid var(--glass-border);
        }
        .btn-task { 
            background: rgba(0, 0, 0, 0.5); 
            color: var(--neon-pink);
            border: 1px solid var(--glass-border);
            font-size: 20px;
        }
        .btn-task:hover { box-shadow: 0 0 18px rgba(255, 0, 229, 0.4); }
        .btn-mic.rec { 
            background: var(--neon-red); 
            color: white;
            animation: micPulse 1s infinite;
        }
        @keyframes micPulse { 
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.7); } 
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 68, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); } 
        }
        
        /* ЯЗЫКИ */
        .btn-lang {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--neon-blue);
            font-size: 18px;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            transition: all 0.3s;
            margin-right: 8px;
        }
        .btn-lang:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .lang-item {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 13px 12px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: all 0.25s;
            color: var(--text);
        }
        .lang-item:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
            transform: translateY(-2px);
        }
        .lang-item.active {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 22px rgba(0, 212, 255, 0.45);
        }
        .lang-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 18px;
        }
        .lang-modal.active { display: flex; }
        .lang-sheet {
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            background: rgba(12, 12, 32, 0.98);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px 16px;
            animation: sheetIn 0.25s ease;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.2);
        }
        .lang-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; text-align: center; }
        .site-sheet { max-width: 460px; margin: 0 auto; }
        .site-label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin: 12px 0 5px;
            font-weight: 700;
        }
        .site-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.25s;
        }
        .site-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);
        }
        .site-list-title {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
        }
        .site-list { margin-top: 10px; }
        .site-empty {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 10px 0;
        }
        .site-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 11px 13px;
            margin-bottom: 8px;
        }
        .site-row-main { min-width: 0; }
        .site-row-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .site-row-sub {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .site-del {
            flex: 0 0 auto;
            background: rgba(255, 0, 68, 0.15);
            border: 1px solid rgba(255, 0, 68, 0.5);
            color: #ff4466;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .site-del:hover { background: rgba(255, 0, 68, 0.3); }
        .btn-site {
            background: rgba(0, 0, 0, 0.5);
            color: #ffd166;
            border: 1px solid var(--glass-border);
            font-size: 20px;
        }
        .btn-site:hover { box-shadow: 0 0 18px rgba(255, 209, 102, 0.4); }
        /* Кнопка озвучки: 🔊 — включена, 🔇 — выключена. Погашенный вид
           обязателен, иначе состояние не отличить, не нажав кнопку. */
        .btn-voice {
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-green);
            border: 1px solid var(--glass-border);
            font-size: 20px;
        }
        .btn-voice:hover { box-shadow: 0 0 18px rgba(0, 255, 136, 0.4); }
        .btn-voice.muted {
            color: var(--muted);
            opacity: 0.55;
        }
        .lang-close {
            width: 100%;
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 13px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* МЕНЮ */
        .overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            display: none; 
            z-index: 20;
            backdrop-filter: blur(3px);
        }
        .overlay.active { display: block; }
        .sidebar { 
            position: absolute; 
            top: 0; 
            right: -85%; 
            width: 85%; 
            height: 100%; 
            background: var(--glass); 
            z-index: 30; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-left: 1px solid var(--glass-border);
            transition: right 0.3s;
            backdrop-filter: blur(20px);
        }
        .sidebar.open { right: 0; }
        .menu-item { 
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .menu-item:hover { 
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--neon-blue);
            transform: translateX(-5px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        .close-btn { 
            background: none; 
            border: none; 
            color: var(--muted); 
            font-size: 30px; 
            cursor: pointer; 
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-left">
                <div class="avatar"><img src="значок.png" alt="OmniLAMo"></div>
                <div>
                    <h2 data-i18n="agentName">OmniLAMo</h2>
                    <span class="status" data-i18n="status">online</span>
                </div>
            </div>
            <div style="display:flex; align-items:center;">
                <button class="btn-lang" onclick="openLangModal()" title="Language">🌐</button>
                <button class="btn-menu" onclick="toggleSidebar()">☰</button>
            </div>
        </div>

        <div class="screen active" id="regScreen">
            <div class="logo">🚀</div>
            <div class="welcome-title">OmniLAMo</div>
            <div class="welcome-subtitle" data-i18n="welcomeSubtitle">Твой личный ИИ-помощник.<br>Общается, помогает с уроками и выполняет команды.</div>
            <input type="text" class="name-input" id="nameInput" placeholder="Как тебя зовут?" data-i18n-ph="namePlaceholder" autofocus>
            <button class="btn-primary" onclick="registerUser()" data-i18n="start">Начать</button>
            <p style="color:var(--muted); font-size:13px;" data-i18n="afterLogin">💡 После входа напиши /help</p>
        </div>

        <div class="chat-screen" id="chatScreen">
            <div class="chat-area" id="chatArea">
                <div class="chat-top" id="chatTop"></div>
            </div>
            <div class="input-area">
                <!-- Первый ряд — только главное: микрофон, поле ввода, отправка. -->
                <div class="input-row">
                    <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>

        function getTime() {

        // Собирает пузырь сообщения. Время берём из истории, если оно там есть:
        // у старых реплик метка должна быть их собственная, а не «сейчас».
        function buildMsg(text, sender, time) {
            const div = document.createElement("div");
            div.className = `msg ${sender}`;
            // Текст вставляем как текст, а не как HTML. Раньше здесь был
            // div.innerHTML = text: ответ нейросети или имя пользователя с
            // символами < > ломали разметку (а имя вида <img onerror=...>
            // исполняло чужой скрипт в браузере). Переводы строк сохраняет
            // CSS white-space: pre-wrap у .msg — раньше они «схлопывались»
            // в один абзац, из-за чего список заданий /tasks шёл в строку.
            div.textContent = text == null ? "" : String(text);
            const stamp = document.createElement("span");
            stamp.className = "msg-time";
            stamp.textContent = time || getTime();
            div.appendChild(stamp);
            return div;
        }

        function addMsg(text, sender) {

        // Реплика из истории: вставляется вверх ленты, сразу после кнопки

        function addMsgAtTop(text, sender, time) {
            const area = document.getElementById("chatArea");
            const top = document.getElementById("chatTop");
            area.insertBefore(buildMsg(text, sender, time), top.nextSibling);

        async function registerUser() {
            const name = document.getElementById("nameInput").value.trim();
            if (!name) return alert(t("enterName"));
            try {
                const res = await fetch(`${SERVER}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                if (data.success) {
                    apiKey = data.api_key;
                    userName = name;
                    localStorage.setItem("lenya_api_key", apiKey);
                    localStorage.setItem("lenya_user_name", userName);
                    show("chatScreen");
                    startSchedulerPolling();
                    // Лента могла остаться от прошлого пользователя на этом же
                    // устройстве — начинаем с чистого листа и подтягиваем журнал
                    // нового пользователя (у только что созданного он пуст).
                    resetChatArea();
                    addMsg(t("greeting")(name), "bot");
                    addMsg(t("helpHint"), "bot");
                    loadHistory();
                    speak(t("greeting")(name).replace(/<[^>]*>/g, ""));
                } else {
                    alert(data.error || t("regError"));
                }
            } catch (e) {
                alert(t("serverDown"));
            }
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, "user");
            input.value = "";

            if (text === "/clear") {
                clearChat();
                // Сервер тоже должен забыть историю диалога: иначе ИИ
                // продолжит отвечать с учётом стёртых реплик.
                fetch(`${SERVER}/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ api_key: apiKey, text: "/clear" })
                }).catch(function() {});
                return;
            }

            addTyping();

            try {
                let endpoint = `${SERVER}/ask`;
                let body = { api_key: apiKey, text: text };

                if (text.toLowerCase().startsWith("запомни")) {
                    endpoint = `${SERVER}/remember`;
                    body = { api_key: apiKey, task: text.replace(/^запомни[: ]/i, "") };
                }
                else if (text === "/news") {
                    // Только явная команда /news уходит в ленту RSS. Раньше
                    // здесь стояло ещё и `includes("новост")`, и любой вопрос
                    // со словом «новости» («объясни, как делают новости»)
                    // показывал заголовки вместо ответа нейросети. Обычный
                    // текст теперь всегда идёт в /ask — сервер сам решает,
                    // просить новости или отвечать (см. _is_news_request).
                    endpoint = `${SERVER}/news`;
                    body = { api_key: apiKey, limit: 8 };
                }
                else if (text.toLowerCase().includes("скачай")) {
                    const url = text.match(/https?:\/\/[^\s]+/);
                    if (url) {
                        endpoint = `${SERVER}/download_file`;
                        body = { api_key: apiKey, url: url[0] };
                    }
                }
                else if (text.toLowerCase().includes("открой ссылку") || text.toLowerCase().includes("зайди на") || text.toLowerCase().includes("перейди")) {
                    const url = text.match(/https?:\/\/[^\s]+/);
                    if (url) {
                        endpoint = `${SERVER}/browse`;
                        body = { api_key: apiKey, url: url[0] };
                    }
                }
                else if (text === "/tasks" || text.toLowerCase().includes("мои задания")) {
                    endpoint = `${SERVER}/get_tasks?api_key=${apiKey}`;
                    const res = await fetch(endpoint);
                    const data = await res.json();
                    removeTyping();
                    // tasks может не прийти вовсе (ошибка БД отдаёт только error),
                    // поэтому проверяем тип: data.tasks.length у undefined роняло
                    // обработчик, и вместо ответа пользователь не видел ничего.
                    const tasks = Array.isArray(data.tasks) ? data.tasks : [];
                    if (data.success && tasks.length > 0) {
                        let taskList = t("yourTasks");
                        tasks.forEach((t2, i) => {
                            taskList += `${i+1}. ${t2.task}\n`;
                        });
                        addMsg(taskList, "bot");
                    } else {
                        addMsg(t("noTasks"), "bot");
                    }
                    return;
                }

                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                removeTyping();

                if (data.success) {
                    addMsg(data.answer || data.message || "✅ " + t("done"), "bot");
                    speak(data.answer || data.message || t("done"));
                } else {
                    addMsg("❌ " + (data.error || t("error")), "bot");
                }
            } catch (e) {
                removeTyping();
                addMsg("❌ " + t("serverDown"), "bot");
            }
        }

        function toggleMic() {
            const btn = document.getElementById("micBtn");
            btn.classList.toggle("rec");
            if (btn.classList.contains("rec")) {
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = LANG === "zh" ? "zh-CN" : LANG === "ja" ? "ja-JP" : LANG === "ar" ? "ar-SA" : LANG === "hi" ? "hi-IN" : LANG;
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    document.getElementById("userInput").value = text;
                    btn.classList.remove("rec");
                    sendMessage();
                };
                recognition.onerror = () => {
                    addMsg(t("voiceError"), "bot");
                    btn.classList.remove("rec");
                };
                recognition.start();
            }
        }

        // Единая проверка «озвучка разрешена»: speak() вызывается из четырёх

        // и раньше каждое из них пришлось бы править отдельно.
        function voiceLang() {

        function speak(text) {
            if (!voiceEnabled) return;
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = voiceLang();
                speechSynthesis.speak(utterance);
            } catch (e) {}
        }

        function applyVoiceButton() {
            const btn = document.getElementById("voiceBtn");
            if (!btn) return;

        function toggleVoice() {

            // договорит до конца, и кнопка будет выглядеть неработающей.
            if (!voiceEnabled && window.speechSynthesis) speechSynthesis.cancel();

        function siteHost(url) {
            try { return new URL(url).hostname.replace(/^www\./, ""); }
            catch (e) { return ""; }
        }

        async function loadSites() {
            const list = document.getElementById("siteList");
            list.innerHTML = `<div class="site-empty">${t("loading")}</div>`;
            try {
                const res = await fetch(`${SERVER}/list_credentials`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ api_key: apiKey })
                });
                const data = await res.json();
                const items = data.sites || data.items || [];
                if (!data.success || items.length === 0) {
                    list.innerHTML = `<div class="site-empty">${t("noSites")}</div>`;
                    return;
                }
                list.innerHTML = items.map(s => {
                    const name = s.title || s.site || t("siteUnknown");
                    const sub = [s.site, s.login].filter(Boolean).join(" • ");
                    return `<div class="site-row">
                        <div class="site-row-main">
                            <div class="site-row-name">${escapeHtml(name)}</div>
                            <div class="site-row-sub">${escapeHtml(sub)}</div>
                        </div>
                        <button class="site-del" onclick="deleteSite('${encodeURIComponent(s.site || "").replace(/'/g, "%27")}')">🗑️</button>
                    </div>`;
                }).join("");
            } catch (e) {
                list.innerHTML = `<div class="site-empty">❌ ${t("serverDown")}</div>`;
            }

        async function saveSite() {
            const url = document.getElementById("siteUrl").value.trim();
            const title = document.getElementById("siteTitle").value.trim();
            const login = document.getElementById("siteLogin").value.trim();
            const password = document.getElementById("sitePassword").value;

            if (!url || !login || !password) return alert(t("siteFillAll"));

            const btn = document.getElementById("siteSaveBtn");
            btn.disabled = true;
            try {
                const res = await fetch(`${SERVER}/save_credentials`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        api_key: apiKey,
                        url: url,
                        site: siteHost(url),
                        login: login,
                        password: password,
                        title: title
                    })
                });
                const data = await res.json();
                if (data.success) {
                    addMsg(`🔐 ${t("siteSaved")}: ${title || siteHost(url)}`, "bot");
                    document.getElementById("siteUrl").value = "";
                    document.getElementById("siteTitle").value = "";
                    document.getElementById("siteLogin").value = "";
                    document.getElementById("sitePassword").value = "";
                    loadSites();

                    alert(data.error || t("error"));

            } catch (e) {
                alert(t("serverDown"));
            } finally {
                btn.disabled = false;
            }

        async function deleteSite(siteEnc) {
            const site = decodeURIComponent(siteEnc);
            if (!confirm(t("siteDeleteConfirm"))) return;
            try {
                const res = await fetch(`${SERVER}/delete_credentials`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },

                });
                const data = await res.json();
                if (data.success) loadSites();
                else alert(data.error || t("error"));
            } catch (e) {
                alert(t("serverDown"));

        const HTML_ESC = {
            "&": "&" + "amp;",
            "<": "&" + "lt;",
            ">": "&" + "gt;",
            '"': "&" + "quot;",
            "'": "&" + "#39;"
        };

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => HTML_ESC[c]);
        }

            fetch(`${SERVER}/ask`, {
                method: "POST",

            .then(data => {

        // ================= СООБЩЕНИЯ ПЛАНИРОВЩИКА =================
        // Задания с расписанием («Один раз 16.09.2026 в 20:04:17») выполняет
        // фоновая нить на сервере. Готовые ответы она складывает в очередь,
        // а страница раз в 15 секунд их забирает и показывает в ленте — иначе
        // задание срабатывало бы, но в чате этого никто не видел.
        async function pollScheduled() {
            if (!apiKey) return;
            try {
                const res = await fetch(`${SERVER}/get_scheduled`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ api_key: apiKey })
                });
                const data = await res.json();
                if (data.success && (data.messages || []).length) {
                    data.messages.forEach(m => {
                        addMsg("🔔 " + m.answer, "bot");
                        speak(m.answer);
                    });
                }
            } catch (e) {}
        }

        // Опрос очереди планировщика. Раньше pollScheduled() был объявлен, но
        // никогда не вызывался: ответы заданий «по расписанию» копились на
        // сервере и в ленту чата не попадали. Запускаем его после входа и
        // дальше раз в 15 секунд.
        let schedulerTimer = null;
        function startSchedulerPolling() {
            if (schedulerTimer) return;
            pollScheduled();
            schedulerTimer = setInterval(pollScheduled, 15000);
        }

        function stopSchedulerPolling() {
            if (!schedulerTimer) return;
            clearInterval(schedulerTimer);
            schedulerTimer = null;
        }

        // ================= ИСТОРИЯ ЧАТА =================
        // Лента при открытии страницы пустая: журнал живёт на сервере, и
        // подгружаем мы его порциями по 20 реплик. Пока листаем вверх, в чат
        // приходят новые сообщения — поэтому курсором служит номер реплики
        // (oldestSeq), а не смещение от конца: иначе страницы съезжали бы.
        let oldestSeq = 0;
        let historyLoading = false;
        let historyDone = false;

        function setHistoryButton(text, onclick) {
            const top = document.getElementById("chatTop");
            top.innerHTML = "";
            if (!text) return;
            const btn = document.createElement("button");
            btn.className = "history-more";
            btn.textContent = text;
            if (onclick) btn.onclick = onclick;
            top.appendChild(btn);
        }

        async function loadHistory() {
            if (historyLoading || historyDone || !apiKey) return;
            historyLoading = true;
            try {
                const res = await fetch(`${SERVER}/history`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ api_key: apiKey, before_seq: oldestSeq, limit: 20 })
                });
                const data = await res.json();
                if (!data.success) { historyDone = true; setHistoryButton(""); return; }
                const msgs = data.messages || [];
                // Сервер отдаёт страницу в хронологическом порядке. Вставляем
                // её сверху по одной реплике, чтобы порядок не перевернулся.
                msgs.forEach(m => addMsgAtTop(m.text, m.role === "bot" ? "bot" : "user", m.ts));
                if (msgs.length) oldestSeq = data.oldest_seq || msgs[0].seq || oldestSeq;
                if (data.has_more) {
                    setHistoryButton(t("historyMore"), loadHistory);
                } else {
                    historyDone = true;
                    setHistoryButton(msgs.length ? t("historyEmpty") : "");
                }
            } catch (e) {
                historyDone = true;
                setHistoryButton("");
            } finally {
                historyLoading = false;
            }
        }

        // Полный сброс ленты: чистим область, возвращаем на место контейнер
        // кнопки «показать раньше» (его сносит innerHTML) и загружаем историю
        // заново — иначе после /clear лента оставалась бы пустой навсегда.
        function resetChatArea() {
            const area = document.getElementById("chatArea");
            area.innerHTML = "";
            const top = document.createElement("div");
            top.className = "chat-top";
            top.id = "chatTop";
            area.appendChild(top);
            oldestSeq = 0;
            historyDone = false;
            historyLoading = false;
        }

        function clearChat() {
            // Вызывается и из меню, и командой /clear: closeSidebar() не открывает
            // меню, когда оно было закрыто (toggle() в этом случае его распахивал).
            closeSidebar();
            // История диалога на сервере тоже стёрта (см. /clear в sendMessage),
            // поэтому журнал начинаем с нуля: сбрасываем курсор и не подтягиваем
            // старые реплики, которых уже нет.
            resetChatArea();
            historyDone = true;
            addMsg(t("chatCleared"), "bot");
        }

        function logout() {
            closeSidebar();
            stopSchedulerPolling();
            apiKey = "";
            userName = "";
            localStorage.removeItem("lenya_api_key");
            localStorage.removeItem("lenya_user_name");
            resetChatArea();
            show("regScreen");
        }

        window.addEventListener("DOMContentLoaded", function() {
            applyLang(LANG);
            if (apiKey && userName) {
                show("chatScreen");
                startSchedulerPolling();
                addMsg(t("back")(userName), "bot");
                addMsg(t("helpHint"), "bot");
                // Подтягиваем переписку с сервера: раньше при перезагрузке
                // страницы лента оказывалась пустой, хотя история сохранялась.
                loadHistory();
            }
        });

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
